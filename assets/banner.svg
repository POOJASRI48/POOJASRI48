<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Pooja Sri S - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030717"/><stop offset=".55" stop-color="#07123A"/><stop offset="1" stop-color="#0A1D5E"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#0A2A8F"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#2F6BFF"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#fff" opacity=".08"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <clipPath id="frame"><rect width="1280" height="340" rx="24"/></clipPath>
  <clipPath id="slab"><rect x="70" y="78" width="540" height="150"/></clipPath>
</defs>
<style>
  .t{font-family:Anton,Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif}
  .u{font-family:"Poppins","Segoe UI",Arial,sans-serif;font-weight:700}
  .rays{transform-origin:340px 153px;animation:spin 60s linear infinite}
  .glowa{animation:pulse 4s ease-in-out infinite alternate}
  .shine{animation:sweep 3.6s ease-in-out infinite}
  .chip{animation:bob 3s ease-in-out infinite}
  .chip:nth-of-type(2){animation-delay:-.6s}.chip:nth-of-type(3){animation-delay:-1.2s}.chip:nth-of-type(4){animation-delay:-1.8s}.chip:nth-of-type(5){animation-delay:-2.4s}
  .line{animation:flow 4s linear infinite}
  .dot{animation:blink 1.6s infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}
  @keyframes sweep{0%{transform:translateX(-220px) skewX(-20deg)}55%,100%{transform:translateX(760px) skewX(-20deg)}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes flow{to{stroke-dashoffset:-60}}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="340" fill="url(#bg)"/>
  <circle class="glowa" cx="180" cy="40" r="170" fill="#1B4DB8" filter="url(#blur)" opacity=".7"/>
  <circle class="glowa" cx="1120" cy="320" r="190" fill="#0A2A8F" filter="url(#blur)" opacity=".8"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <g class="rays"><circle cx="340" cy="153" r="260" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="520" stroke-dasharray="34 34"/></g>

  <!-- name slab -->
  <g transform="rotate(-2 340 153)">
    <rect x="82" y="90" width="540" height="150" fill="#000" opacity=".55"/>
    <rect x="70" y="78" width="540" height="150" fill="url(#blue)" stroke="#fff" stroke-width="6"/>
    <g clip-path="url(#slab)"><rect class="shine" x="70" y="70" width="110" height="170" fill="#fff" opacity=".85"/></g>
    <text class="t" x="340" y="196" text-anchor="middle" font-size="100" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" letter-spacing="1.5" textLength="480" lengthAdjust="spacingAndGlyphs" stroke="#030717" stroke-width="5" paint-order="stroke">POOJA SRI S</text>
  </g>
  <text class="u" x="340" y="276" text-anchor="middle" font-size="15" letter-spacing="5" fill="#fff" opacity=".9">LEARNING  ·  BUILDING  ·  IMPROVING</text>

  <!-- right side -->
  <g>
    <rect x="684" y="64" width="190" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/>
    <circle class="dot" cx="704" cy="79" r="4.5" fill="#8FB2FF"/>
    <text class="u" x="718" y="84" font-size="12" letter-spacing="3" fill="#DDE6FF">OPEN TO WORK</text>
    <text class="t" x="684" y="158" font-size="52" fill="#fff" letter-spacing="1.5">FULL STACK DEVELOPER</text>
    <rect class="line" x="684" y="184" width="520" height="3" rx="2" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="30 30"/>
    <g class="u" font-size="13" fill="#fff" text-anchor="middle">
      <g class="chip"><rect x="684" y="212" width="86" height="30" rx="15" fill="#2F6BFF"/><text x="727" y="232">PYTHON</text></g>
      <g class="chip"><rect x="780" y="212" width="92" height="30" rx="15" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".3"/><text x="826" y="232">NODE</text></g>
      <g class="chip"><rect x="882" y="212" width="76" height="30" rx="15" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".3"/><text x="920" y="232">REACT</text></g>
      <g class="chip"><rect x="968" y="212" width="76" height="30" rx="15" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".3"/><text x="1006" y="232">CLOUD</text></g>
      <g class="chip"><rect x="1054" y="212" width="76" height="30" rx="15" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".3"/><text x="1092" y="232">MONGODB</text></g>
    </g>
  </g>
</g>
<rect x="3" y="3" width="1274" height="334" rx="22" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
</svg>
