<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Animated development process: discover, plan, design, develop, test, deploy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Process: Discover, Plan, Design, Develop, Test, Deploy</title>
<defs>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00022E"/><stop offset="1" stop-color="#00010F"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.n{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:13px;fill:#C8D3FF;fill-opacity:.85}
.h{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:22px;fill:#fff}
.s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:500;font-size:14px;fill:#A9B8FF}
.i{fill:none;stroke:#C8D3FF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="8" y="8" width="984" height="284" rx="26" fill="#00010A" stroke="#23265A" stroke-width="3"/>
<rect x="30" y="36" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<text class="n" x="50" y="62">01</text>
<text class="h" x="50" y="100">DISCOVER</text>
<text class="s" x="50" y="130">Understand the problem</text>
<g class="i" transform="translate(285 48)"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M11.8 11.8L16 16"/></g>
<rect x="345" y="36" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="2s" repeatCount="indefinite"/></rect>
<text class="n" x="365" y="62">02</text>
<text class="h" x="365" y="100">PLAN</text>
<text class="s" x="365" y="130">Requirements &amp; architecture</text>
<g class="i" transform="translate(600 48)"><rect x="3" y="3" width="12" height="14" rx="2"/><rect x="6" y="1" width="6" height="4" rx="1"/><path d="M6 9h6M6 12h6"/></g>
<rect x="660" y="36" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect>
<text class="n" x="680" y="62">03</text>
<text class="h" x="680" y="100">DESIGN</text>
<text class="s" x="680" y="130">UI/UX &amp; wireframes</text>
<g class="i" transform="translate(915 48)"><path d="M10 3l5 5-7 7-5 1 1-5z"/><path d="M3 16l4-4"/></g>
<rect x="30" y="156" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="6s" repeatCount="indefinite"/></rect>
<text class="n" x="50" y="182">04</text>
<text class="h" x="50" y="220">DEVELOP</text>
<text class="s" x="50" y="250">Frontend &amp; backend</text>
<g class="i" transform="translate(285 168)"><path d="M6 5L2 9l4 4M12 5l4 4-4 4M10.5 3l-3 12"/></g>
<rect x="345" y="156" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect>
<text class="n" x="365" y="182">05</text>
<text class="h" x="365" y="220">TEST</text>
<text class="s" x="365" y="250">Debug &amp; validate</text>
<g class="i" transform="translate(600 168)"><circle cx="9" cy="10" r="6"/><path d="M9 7v3l2 1.5M2 4l3-2M16 4l-3-2"/></g>
<rect x="660" y="156" width="290" height="110" rx="14" fill="url(#hl)" stroke="#8A9BFF" stroke-width="1.5" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.14;0.18;1" dur="12s" begin="10s" repeatCount="indefinite"/></rect>
<text class="n" x="680" y="182">06</text>
<text class="h" x="680" y="220">DEPLOY</text>
<text class="s" x="680" y="250">Launch &amp; monitor</text>
<g class="i" transform="translate(915 168)"><path d="M9 1c3 2 4 6 3 10l-3 2-3-2c-1-4 0-8 3-10z"/><circle cx="9" cy="6" r="1.2"/><path d="M6 11l-3 2 1 3 3-2M12 11l3 2-1 3-3-2"/></g>
</svg>
