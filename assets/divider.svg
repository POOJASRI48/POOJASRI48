<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4958A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4958A" stop-opacity="1"/>
      <stop offset="1" stop-color="#D4958A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="24" fill="#110E10"/>
  <rect x="40" y="11.25" width="920" height="1.5" fill="url(#line)"/>
  <circle cx="450" cy="12" r="2" fill="#8C4F57"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="12" r="2" fill="#8C4F57"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <g transform="translate(500 12)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="2.4s" repeatCount="indefinite"/>
      <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#110E10" stroke="#F2C4B8" stroke-width="1.5"/>
      <rect x="-2" y="-2" width="4" height="4" transform="rotate(45)" fill="#FFE6DE"/>
    </g>
  </g>
</svg>
