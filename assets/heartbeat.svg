<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Commit pulse" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EDE3E0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1000" height="120" rx="16" fill="#110E10"/>
  <rect width="1000" height="120" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="118" rx="15" fill="none" stroke="#D4958A" stroke-opacity="0.55" stroke-width="1.5"/>

  <g font-family="Consolas,'Courier New',monospace" fill="#EDE3E0">
    <text x="24" y="22" font-size="10" letter-spacing="2" opacity="0.6">// commit.pulse</text>
  </g>

  <g>
    <path d="M36 86 A36 36 0 0 1 108 86" fill="none" stroke="#8C4F57" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#D4958A" stroke-width="1.5" stroke-linecap="round">
      <line x1="30" y1="86" x2="24" y2="86"/>
      <line x1="42.3" y1="56.3" x2="38" y2="52"/>
      <line x1="72" y1="44" x2="72" y2="38"/>
      <line x1="101.7" y1="56.3" x2="106" y2="52"/>
      <line x1="114" y1="86" x2="120" y2="86"/>
    </g>
    <line x1="72" y1="86" x2="72" y2="58" stroke="#F2C4B8" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-70 72 86;60 72 86;-20 72 86;70 72 86;-70 72 86" dur="6s" repeatCount="indefinite"/>
    </line>
    <circle cx="72" cy="86" r="4" fill="#FFE6DE"/>
    <text x="72" y="108" font-family="Consolas,'Courier New',monospace" font-size="9" letter-spacing="2" fill="#EDE3E0" text-anchor="middle" opacity="0.7">LOAD</text>
  </g>

  <path d="M140 70 H210 L222 70 L230 56 L238 78 L248 22 L258 100 L268 70 H330 L340 64 L348 70 H400 L410 70 L418 56 L426 78 L436 22 L446 100 L456 70 H520 L530 66 L538 70 H600 L612 70 L620 56 L628 78 L638 22 L648 100 L658 70 H730 L740 64 L748 70 H860" id="ecg" fill="none" stroke="#8C4F57" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M140 70 H210 L222 70 L230 56 L238 78 L248 22 L258 100 L268 70 H330 L340 64 L348 70 H400 L410 70 L418 56 L426 78 L436 22 L446 100 L456 70 H520 L530 66 L538 70 H600 L612 70 L620 56 L628 78 L638 22 L648 100 L658 70 H730 L740 64 L748 70 H860" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" fill="none" stroke="#D4958A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" values="1000;0;0;-1000" keyTimes="0;0.6;0.8;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.68;1" dur="5s" repeatCount="indefinite"/>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.6;1"><mpath href="#ecg"/></animateMotion>
    <circle r="9" fill="#D4958A" opacity="0.5" filter="url(#blur)"/>
    <circle r="4.5" fill="#FFE6DE"/>
  </g>

  <g font-family="Consolas,'Courier New',monospace" font-size="8" letter-spacing="1.5" fill="#EDE3E0" opacity="0.55" text-anchor="middle">
    <g stroke="#EDE3E0" stroke-width="1" opacity="0.8">
      <line x1="180" y1="103" x2="180" y2="107"/><line x1="340" y1="103" x2="340" y2="107"/><line x1="500" y1="103" x2="500" y2="107"/><line x1="660" y1="103" x2="660" y2="107"/><line x1="820" y1="103" x2="820" y2="107"/>
    </g>
    <text x="180" y="116">CODE</text>
    <text x="340" y="116">BUILD</text>
    <text x="500" y="116">TEST</text>
    <text x="660" y="116">SHIP</text>
    <text x="820" y="116">LEARN</text>
  </g>

  <g font-family="Consolas,'Courier New',monospace" font-size="9" letter-spacing="1" fill="#EDE3E0">
    <text x="876" y="40" opacity="0.75">LEARN</text>
    <text x="876" y="62" opacity="0.75">BUILD</text>
    <text x="876" y="84" opacity="0.75">IMPROVE</text>
    <rect x="924" y="34" width="56" height="6" rx="3" fill="#8C4F57" opacity="0.35"/>
    <rect x="924" y="56" width="56" height="6" rx="3" fill="#8C4F57" opacity="0.35"/>
    <rect x="924" y="78" width="56" height="6" rx="3" fill="#8C4F57" opacity="0.35"/>
    <rect x="924" y="34" width="20" height="6" rx="3" fill="#D4958A"><animate attributeName="width" values="14;50;14" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="924" y="56" width="40" height="6" rx="3" fill="#F2C4B8"><animate attributeName="width" values="46;18;46" dur="4.4s" repeatCount="indefinite"/></rect>
    <rect x="924" y="78" width="30" height="6" rx="3" fill="#FFE6DE"><animate attributeName="width" values="20;56;20" dur="5.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
