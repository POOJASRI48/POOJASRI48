<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-label="Poojasri S - Full Stack Developer portfolio">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101B45"/>
      <stop offset="1" stop-color="#050B20"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07132F"/>
      <stop offset="1" stop-color="#101D49"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#FFFFFF" opacity=".09"/>
    </pattern>
    <clipPath id="frame"><rect x="14" y="14" width="1252" height="262"/></clipPath>
    <clipPath id="browser"><rect x="800" y="44" width="400" height="150" rx="12"/></clipPath>
  </defs>
  <style>
    .display{font-family:Impact,"Arial Black",sans-serif;font-weight:900}
    .ui{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:700}
    .ticker{animation:move 28s linear infinite}
    .button{transform-origin:240px 190px;animation:pulse 1.8s ease-in-out infinite}
    .rays{transform-origin:1000px 118px;animation:rotate 80s linear infinite}
    .load{transform-box:fill-box;transform-origin:left;animation:load 3s ease-in-out infinite alternate}
    .load:nth-of-type(2){animation-delay:-1s}
    .load:nth-of-type(3){animation-delay:-2s}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes move{to{transform:translateX(-960px)}}
    @keyframes pulse{50%{transform:scale(1.045)}}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes load{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect x="26" y="26" width="1240" height="244" fill="#000000" opacity=".55"/>
  <rect x="14" y="14" width="1252" height="262" fill="url(#panel)" stroke="#FFFFFF" stroke-width="5"/>
  <g clip-path="url(#frame)">
    <rect x="14" y="14" width="1252" height="262" fill="url(#dots)"/>
    <g class="rays">
      <circle cx="1000" cy="118" r="300" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="600" stroke-dasharray="40 40"/>
    </g>

    <text class="ui" x="60" y="64" font-size="13" letter-spacing="6" fill="#AFC3FF">FULL STACK DEVELOPER</text>
    <text class="display" x="60" y="132" font-size="76" fill="#FFFFFF" stroke="#030817" stroke-width="4" paint-order="stroke" textLength="650" lengthAdjust="spacingAndGlyphs">POOJASRI S</text>
    <text class="ui" x="62" y="157" font-size="16" fill="#E5EBFF" letter-spacing="1">Building web applications · Exploring ideas · Solving problems</text>

    <!-- Decorative call-to-action; wrap the banner image in a link in README.md -->
    <g class="button">
      <rect x="67" y="175" width="356" height="40" rx="20" fill="#000000" opacity=".45" transform="translate(4 4)"/>
      <rect x="62" y="170" width="356" height="40" rx="20" fill="url(#navy)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text class="ui" x="240" y="196" text-anchor="middle" font-size="15" letter-spacing="3" fill="#FFFFFF">OPEN MY PORTFOLIO ↗</text>
    </g>

    <!-- Browser preview -->
    <rect x="812" y="56" width="400" height="150" rx="12" fill="#000000" opacity=".45"/>
    <rect x="800" y="44" width="400" height="150" rx="12" fill="#050B20" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2"/>
    <g clip-path="url(#browser)">
      <rect x="800" y="44" width="400" height="26" fill="#FFFFFF" fill-opacity=".08"/>
      <circle cx="820" cy="57" r="5" fill="#AFC3FF"/>
      <circle cx="838" cy="57" r="5" fill="#FFFFFF" opacity=".75"/>
      <circle cx="856" cy="57" r="5" fill="#526FBF"/>
      <rect x="880" y="49" width="230" height="16" rx="8" fill="#FFFFFF" fill-opacity=".1"/>
      <text class="ui" x="995" y="61" text-anchor="middle" font-size="9.5" fill="#E5EBFF" letter-spacing="1">poojasri · portfolio</text>
      <text class="display" x="824" y="116" font-size="34" fill="#AFC3FF">Poojasri<tspan class="cursor" fill="#FFFFFF">|</tspan></text>
      <rect class="load" x="824" y="130" width="200" height="6" rx="3" fill="#FFFFFF"/>
      <rect class="load" x="824" y="144" width="150" height="6" rx="3" fill="#AFC3FF" opacity=".8"/>
      <rect class="load" x="824" y="158" width="176" height="6" rx="3" fill="#526FBF"/>
      <rect x="1050" y="86" width="132" height="92" rx="10" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".35"/>
      <circle cx="1116" cy="124" r="22" fill="#172B65"/>
      <path d="M1108 124h16m-7-7 7 7-7 7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Scrolling skills strip -->
    <rect x="14" y="236" width="1252" height="40" fill="#071536"/>
    <g class="ticker ui" font-size="13" letter-spacing="4" fill="#FFFFFF">
      <text x="20" y="261">PYTHON ★ DJANGO ★ JAVASCRIPT ★ REACT ★ TYPESCRIPT ★ NODE.JS ★ MONGODB ★ POSTGRESQL ★ GIT ★ PYTHON ★ DJANGO ★ JAVASCRIPT ★ REACT ★ TYPESCRIPT ★ NODE.JS ★ MONGODB ★ POSTGRESQL ★ GIT ★</text>
    </g>
  </g>
</svg>
